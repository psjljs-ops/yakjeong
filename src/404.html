<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>페이지를 찾을 수 없어요</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root { --bg:#f2f4f6; --card:#fff; --text:#191f28; --sub:#4e5968; --blue:#3182f6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#101013; --card:#1c1c21; --text:#f2f3f5; --sub:#c3c8cf; --blue:#4d94ff; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
    font-family:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",sans-serif; padding:16px; box-sizing:border-box; }
  .card { background:var(--card); border-radius:22px; padding:36px 28px; text-align:center; max-width:420px; width:100%; }
  h1 { font-size:24px; margin:0 0 8px; } p { color:var(--sub); margin:0 0 24px; }
  a { display:inline-block; background:var(--blue); color:#fff; text-decoration:none; font-weight:700; padding:14px 22px; border-radius:14px; }
</style>
</head>
<body>
  <div class="card">
    <h1>페이지를 찾을 수 없어요</h1>
    <p>주소가 바뀌었거나 없는 페이지예요.</p>
    <a href="/">처음으로 가기</a>
  </div>
</body>
</html>
